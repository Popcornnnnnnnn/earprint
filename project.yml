name: Earprint
options:
  bundleIdPrefix: com.popcornnn
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: R26X7B8XDT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "15"
targets:
  Earprint:
    type: application
    platform: iOS
    sources:
      - path: Earprint
        excludes:
          - Resources/Models/**
          - Resources/l10n-*.json
          - Resources/Earprint.storekit
      - path: Earprint/Resources/Models
        buildPhase: resources
      # Shared with the widget extension: snapshot model, App Group store, Live Activity attributes.
      - Shared
    dependencies:
      - target: EarprintWidgets
        embed: true
    entitlements:
      path: Earprint/Earprint.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.popcornnn.earprint
    info:
      path: Earprint/Info.plist
      properties:
        CFBundleDisplayName: Earprint
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHealthShareUsageDescription: Earprint reads your headphone audio levels from Apple Health to show how long and how loudly you listen. Data stays on your iPhone.
        NSHealthUpdateUsageDescription: Earprint reads your headphone audio levels from Apple Health to build your listening archive and never writes data to Apple Health.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.popcornnn.earprint
            CFBundleURLSchemes:
              - earprint
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.popcornnn.earprint
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconMidnightAuto AppIconMidnightLight AppIconMidnightDark AppIconMidnightHolo AppIconStarlightAuto AppIconStarlightLight AppIconStarlightDark AppIconStarlightHolo AppIconBlueAuto AppIconBlueLight AppIconBlueDark AppIconBlueHolo AppIconPurpleAuto AppIconPurpleLight AppIconPurpleDark AppIconPurpleHolo AppIconOrangeAuto AppIconOrangeLight AppIconOrangeDark AppIconOrangeHolo AppIconSpaceGrayAuto AppIconSpaceGrayLight AppIconSpaceGrayDark AppIconSpaceGrayHolo AppIconSilverAuto AppIconSilverLight AppIconSilverDark AppIconSilverHolo AppIconSkyBlueAuto AppIconSkyBlueLight AppIconSkyBlueDark AppIconSkyBlueHolo AppIconGreenAuto AppIconGreenLight AppIconGreenDark AppIconGreenHolo AppIconPinkAuto AppIconPinkLight AppIconPinkDark AppIconPinkHolo"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

  # Home Screen + Lock Screen widgets and the "Listening now" Live Activity.
  EarprintWidgets:
    type: app-extension
    platform: iOS
    sources:
      - EarprintWidgets
      - Shared
      # Pure design files reused from the app (no app-only dependencies).
      - Earprint/Design/Theme.swift
      - Earprint/Design/EarprintGlyph.swift
    entitlements:
      path: EarprintWidgets/EarprintWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.popcornnn.earprint
    info:
      path: EarprintWidgets/Info.plist
      properties:
        CFBundleDisplayName: Earprint
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.popcornnn.earprint.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # Fast unit tests for HealthKit aggregation, grid bucketing, and device-ID catalog.
  EarprintTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EarprintTests
      - path: Earprint/Resources/Earprint.storekit
        buildPhase: resources
    dependencies:
      - target: Earprint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.popcornnn.earprint.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

  # Renders every widget view to PNG with ImageRenderer (writes docs/widgets/*.png).
  # Run: xcodebuild test -scheme Earprint -only-testing:EarprintWidgetRenders ...
  EarprintWidgetRenders:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EarprintWidgetRenders
      - Shared
      - EarprintWidgets/Views
      - Earprint/Design/Theme.swift
      - Earprint/Design/EarprintGlyph.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.popcornnn.earprint.widget-renders
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Earprint:
    build:
      targets:
        Earprint: all
        EarprintTests: [test]
        EarprintWidgetRenders: [test]
    run:
      config: Debug
      storeKitConfiguration: Earprint/Resources/Earprint.storekit
    test:
      config: Debug
      storeKitConfiguration: Earprint/Resources/Earprint.storekit
      targets:
        - EarprintTests
    archive:
      config: Release
