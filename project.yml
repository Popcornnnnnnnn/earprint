name: Earprint
options:
  bundleIdPrefix: com.popcornnn
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: R26X7B8XDT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Earprint:
    type: application
    platform: iOS
    sources:
      - Earprint
    entitlements:
      path: Earprint/Earprint.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Earprint/Info.plist
      properties:
        CFBundleDisplayName: Earprint
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHealthShareUsageDescription: Earprint reads your headphone audio levels from Apple Health to show how long and how loudly you listen. Data stays on your iPhone.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.popcornnn.earprint
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          # Debug-only write description for the Simulator HealthKit seeder (`HealthKitSeeder.swift`).
          # Release builds omit this key and never request write authorization.
          INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Debug builds can write sample headphone audio data into the simulator's Apple Health store for local testing."
  EarprintTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EarprintTests
    dependencies:
      - target: Earprint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.popcornnn.earprint.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Earprint:
    build:
      targets:
        Earprint: all
        EarprintTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EarprintTests
    archive:
      config: Release
